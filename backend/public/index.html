<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>زول فود</title>
<style>
:root{--g:#0F4D3A;--gold:#C9A24B;--bg:#FAF6EC;--c:#fff;--tx:#1B1B1A;--mu:#6b6b63;--ln:#e8e1cf}
@media(prefers-color-scheme:dark){:root{--bg:#121513;--c:#1c211e;--tx:#f3efe3;--mu:#a5a597;--ln:#2c332f;--g:#1d7a5c}}
*{box-sizing:border-box;margin:0}body{font-family:Tajawal,Tahoma,sans-serif;background:var(--bg);color:var(--tx);max-width:520px;margin:auto;padding-bottom:80px}
header{background:var(--g);color:#fff;padding:14px;display:flex;justify-content:space-between;font-weight:800}header a{color:var(--gold);font-weight:400;font-size:13px}
main{padding:14px}.card{background:var(--c);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.mu{color:var(--mu);font-size:13px}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--g);color:#fff;font:inherit;font-weight:700}button.g{background:var(--gold);color:#1B1B1A}button.o{background:none;color:var(--g);border:1px solid var(--g)}button.f{width:100%;margin-top:8px}
input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--ln);background:var(--c);color:var(--tx);font:inherit;margin:6px 0}
.tag{font-size:12px;padding:2px 8px;border-radius:8px;border:1px solid var(--ln)}h2{font-size:18px;margin:12px 0 8px}
</style></head><body>
<header><span>زول فود</span><a href="#" id="out"></a></header><main id="m"></main>
<script>
let tok=null,role=null,view='home',rid=null,menu=[],cart={},cur=null,phone='',step='phone',pay='cash',addr='',err='';
try{tok=localStorage.getItem('t');role=localStorage.getItem('r')}catch{}
const ST={new:'تم استلام الطلب',accepted:'المطعم أكّد الطلب',preparing:'جاري التجهيز',ready:'الطعام جاهز',picked_up:'المندوب في الطريق',delivered:'تم التسليم',cancelled:'ملغي'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f=n=>Number(n).toLocaleString('ar-EG')+' ج',$=s=>document.querySelector(s);
async function api(p,m='GET',b){const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:b?JSON.stringify(b):undefined});
 const j=await r.json().catch(()=>({}));if(r.status==401&&tok){logout();return{}}if(!r.ok){err=j.error||'خطأ';throw new Error(err)}return j}
function logout(){tok=role=null;try{localStorage.clear()}catch{}step='phone';draw()}
$('#out').onclick=e=>{e.preventDefault();logout()};
const go=fn=>async(...a)=>{try{err='';await fn(...a)}catch(e){}draw()};
const doOtp=go(async()=>{phone=$('#ph').value;await api('/auth/otp','POST',{phone});step='code'});
const doVerify=go(async()=>{const j=await api('/auth/verify','POST',{phone,code:$('#cd').value});tok=j.token;role=j.role;try{localStorage.setItem('t',tok);localStorage.setItem('r',role)}catch{}view='home';await load()});
let data=null;
async function load(){
 if(!tok)return;
 try{
  if(role=='customer'){if(view=='home')data=await api('/restaurants');if(view=='orders')data=await api('/orders/mine');if(view=='track')cur=await api('/orders/'+cur.id)}
  if(role=='restaurant')data=await api('/restaurant/orders');
  if(role=='courier')data={a:await api('/courier/available'),m:await api('/courier/mine')};
  if(role=='admin')data=await api('/admin/stats');
 }catch{}draw()}
setInterval(()=>{if(tok&&!['menu','cart'].includes(view))load()},5000);
const open=go(async id=>{rid=id;menu=await api('/restaurants/'+id+'/menu');view='menu'});
const add=(id,d)=>{cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];draw()};
const total=()=>menu.reduce((a,m)=>a+m.price*(cart[m.id]||0),0);
const place=go(async()=>{if(!addr.trim()){err='اكتب العنوان';return}
 const items=Object.keys(cart).map(id=>({itemId:+id,qty:cart[id]}));
 const j=await api('/orders','POST',{restaurantId:rid,items,address:addr,payMethod:pay,idemKey:crypto.randomUUID()});
 cart={};cur={id:j.orderId};view='track';cur=await api('/orders/'+j.orderId)});
const st=go(async(id,s)=>{await api(`/orders/${id}/status`,'POST',{status:s});await load()});
const E={invalid_phone:'رقم الهاتف غير صحيح',otp_wrong:'الرمز غير صحيح',otp_expired:'انتهت صلاحية الرمز',insufficient_balance:'رصيد المحفظة لا يكفي',restaurant_unavailable:'المطعم غير متاح'};
function draw(){
 $('#out').textContent=tok?'خروج':'';
 let h='';
 if(!tok){h=`<h2>تسجيل الدخول</h2>`+(step=='phone'?`<input id="ph" placeholder="رقم الهاتف +249..." inputmode="tel"><button class="f" onclick="doOtp()">إرسال الرمز</button>`:`<input id="cd" placeholder="رمز التحقق" inputmode="numeric"><button class="f" onclick="doVerify()">دخول</button>`)}
 else if(role=='customer'){
  if(view=='menu')h=`<button class="o" onclick="view='home';load()">رجوع</button><h2>القائمة</h2>${menu.map(m=>`<div class="card row"><div><b>${esc(m.name)}</b><div class="mu">${f(m.price)}</div></div><div class="row">${cart[m.id]?`<button class="o" onclick="add(${m.id},-1)">−</button>${cart[m.id]}`:''}<button onclick="add(${m.id},1)">+</button></div></div>`).join('')}${total()?`<button class="g f" onclick="view='cart';draw()">السلة · ${f(total())}</button>`:''}`;
  else if(view=='cart')h=`<h2>تأكيد الطلب</h2><div class="card"><div class="row"><span>المنتجات</span><span>${f(total())}</span></div><div class="mu">رسوم التوصيل والخدمة يحسبها الخادم وتظهر بعد التأكيد</div></div><input placeholder="عنوان التوصيل" value="${esc(addr)}" oninput="addr=this.value"><div class="card"><label><input type="radio" name="p" ${pay=='cash'?'checked':''} onchange="pay='cash'" style="width:auto"> عند الاستلام</label><br><label><input type="radio" name="p" ${pay=='wallet'?'checked':''} onchange="pay='wallet'" style="width:auto"> المحفظة</label></div><button class="g f" onclick="place()">تأكيد الطلب</button><button class="o f" onclick="view='menu';draw()">رجوع</button>`;
  else if(view=='track'&&cur)h=`<h2>طلب #${cur.id}</h2><div class="card"><b>${ST[cur.status]||'...'}</b>${(cur.items||[]).map(i=>`<div class="row mu"><span>${i.qty}× ${esc(i.name)}</span><span>${f(i.unit_price*i.qty)}</span></div>`).join('')}<div class="row"><span>التوصيل</span><span>${f(cur.delivery_fee||0)}</span></div><div class="row"><b>الإجمالي</b><b>${f(cur.total||0)}</b></div></div><button class="f" onclick="view='home';load()">الرئيسية</button>`;
  else if(view=='orders')h=`<h2>طلباتي</h2>${(data||[]).map(o=>`<div class="card row" onclick="cur={id:${o.id}};view='track';load()"><span>#${o.id}</span><span class="tag">${ST[o.status]}</span><span>${f(o.total)}</span></div>`).join('')||'<p class="mu">لا طلبات بعد.</p>'}`;
  else h=`<h2>المطاعم</h2>${(data||[]).map(r=>`<div class="card row" onclick="open(${r.id})"><div><b>${esc(r.name)}</b><div class="mu">${esc(r.category)} · ★ ${r.rating} · ${r.prep_minutes} د</div></div></div>`).join('')}<button class="o f" onclick="view='orders';load()">طلباتي</button>`}
 else if(role=='restaurant'){const N={new:['accepted','قبول'],accepted:['preparing','بدء التجهيز'],preparing:['ready','الطعام جاهز']};
  h=`<h2>طلبات المطعم</h2>${(data||[]).map(o=>`<div class="card"><div class="row"><b>#${o.id}</b><span class="tag">${ST[o.status]}</span></div>${(o.items||[]).map(i=>`<div class="mu">${i.qty}× ${esc(i.name)}</div>`).join('')}${N[o.status]?`<button class="f" onclick="st(${o.id},'${N[o.status][0]}')">${N[o.status][1]}</button>`:''}${o.status=='new'?`<button class="o f" onclick="st(${o.id},'cancelled')">رفض</button>`:''}</div>`).join('')||'<p class="mu">لا طلبات.</p>'}`}
 else if(role=='courier')h=`<h2>طلبات متاحة</h2>${(data?.a||[]).map(o=>`<div class="card"><b>#${o.id}</b> ← ${esc(o.address_text)}<button class="f" onclick="st(${o.id},'picked_up')">استلام الطلب</button></div>`).join('')||'<p class="mu">لا شيء جاهز.</p>'}<h2>قيد التوصيل</h2>${(data?.m||[]).map(o=>`<div class="card"><b>#${o.id}</b> إلى ${esc(o.address_text)}<div class="mu">${o.pay_method=='cash'?'حصّل '+f(o.total):'مدفوع'}</div><button class="g f" onclick="st(${o.id},'delivered')">تأكيد التسليم</button></div>`).join('')}`;
 else if(role=='admin'&&data)h=`<h2>الإدارة</h2><div class="card">الطلبات: ${data.orders}</div><div class="card">المبيعات: ${f(data.sales)}</div><div class="card">إيرادات المنصة: ${f(data.revenue)}</div><div class="card">معدل الإلغاء: ${data.cancel_rate}%</div>`;
 if(err)h+=`<p style="color:#c0392b;margin-top:10px">${esc(E[err]||err)}</p>`;
 $('#m').innerHTML=h}
draw();load();
</script></body></html>
