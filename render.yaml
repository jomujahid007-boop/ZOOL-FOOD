services:
  - type: web
    name: zol-food-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /restaurants
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zol-food-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
databases:
  - name: zol-food-db
    plan: free
    databaseName: zolfood
